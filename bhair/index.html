<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Braider Site Template — Marvaden Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  MARVADEN STUDIO — SOFT BRAIDER TEMPLATE
  To make a new client site: copy this file and edit only the SITE object in the <script> at the bottom.
  Themes: "terracotta" · "blush" · "lilac" · "sage" · "champagne"
  Hero shapes: "arch" · "blob"     Gallery: "stagger" · "grid"
-->
<style>
:root{--r:26px}
[data-theme=terracotta]{--bg:#f8f1e7;--bg2:#efe2cf;--card:#fffaf3;--line:#ecdcc6;--accent:#b4532a;--accent-d:#8a3b1b;--ink:#2b1d14;--muted:#6f5a4b;--soft:#f3d2b3;--deep:#2b1d14;--deep-text:#cdbba6;--hi:#c99a3b;--a1:#c4683c;--a2:#7a3317}
[data-theme=blush]{--bg:#fdf4f2;--bg2:#f8e1dc;--card:#fffafa;--line:#f1d8d3;--accent:#c4677a;--accent-d:#a24c5f;--ink:#3a2229;--muted:#7d5f66;--soft:#fbe0e4;--deep:#4a2a33;--deep-text:#e7c9cf;--hi:#e3a6b1;--a1:#e8a3ad;--a2:#b65c6e}
[data-theme=lilac]{--bg:#f7f3fb;--bg2:#ebe2f5;--card:#fdfbff;--line:#e3d8ef;--accent:#8a5fb5;--accent-d:#6c4596;--ink:#2d2238;--muted:#6c5d7a;--soft:#e9dcf6;--deep:#3a2b4a;--deep-text:#d6c8e6;--hi:#c7a8e6;--a1:#b896dc;--a2:#6c4596}
[data-theme=plum]{--pink:#f4a7bb;--bg:#fbf5f4;--bg2:#f3e1e6;--card:#ffffff;--line:#ecd8de;--accent:#6e2a75;--accent-d:#4a1a50;--ink:#22101f;--muted:#6a5468;--soft:#f4d6de;--deep:#2a0f2e;--deep-text:#e3cfe5;--hi:#e3b04f;--a1:#8a3f93;--a2:#2f1235}
[data-theme=sage]{--bg:#f4f6f0;--bg2:#e3e9da;--card:#fcfdf9;--line:#dbe3d0;--accent:#6b8a5c;--accent-d:#516b45;--ink:#24301f;--muted:#5f6c58;--soft:#dfe8d4;--deep:#2f3b2a;--deep-text:#cbd6c0;--hi:#c9b37a;--a1:#9bb489;--a2:#516b45}
[data-theme=champagne]{--bg:#fbf7ef;--bg2:#f1e6d1;--card:#fffdf8;--line:#ecdfc6;--accent:#b08a3e;--accent-d:#8c6c2c;--ink:#2e2516;--muted:#6f6350;--soft:#f3e6c8;--deep:#3a2f1c;--deep-text:#dccfb4;--hi:#e0c27a;--a1:#d9b86a;--a2:#8c6c2c}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.6}
a{color:inherit}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.ribbon{background:var(--deep);color:var(--deep-text);font-size:12px;text-align:center;padding:7px 16px}
.ribbon b{color:var(--hi)}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;max-width:1080px;margin:0 auto}
.logo{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:27px}
.logo span{color:var(--accent);font-style:italic}
nav a{font-size:14px;text-decoration:none;margin-left:18px;color:var(--muted)}
@media(max-width:640px){nav{display:none}}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:13px 24px;border-radius:999px;font-weight:700;font-size:15px;border:2px solid var(--accent);box-shadow:0 10px 24px -14px var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}

.hero{max-width:1080px;margin:0 auto;padding:24px 20px 56px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:8px}}
.eyebrow{display:inline-block;background:var(--bg2);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--accent-d)}
h1{font-family:"Cormorant Garamond",serif;font-size:clamp(42px,7.5vw,70px);line-height:1.02;margin:16px 0 14px;font-weight:600}
h1 em{color:var(--accent)}
.lede{font-size:17px;color:var(--muted);max-width:30em}
.stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.stats div{font-size:13px;color:var(--muted)}
.stats strong{display:block;font-family:"Cormorant Garamond",serif;font-size:30px;color:var(--ink)}

.art{aspect-ratio:4/5;position:relative;overflow:hidden;background:radial-gradient(circle at 28% 22%,var(--soft) 0 16%,transparent 17%),linear-gradient(165deg,var(--a1),var(--a2));box-shadow:0 34px 60px -34px var(--accent-d)}
.art.arch{border-radius:220px 220px 32px 32px}
.art.blob{border-radius:58% 42% 48% 52%/46% 54% 46% 54%}
.art.blob .tag{left:15%;right:15%;bottom:13%}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art .tag{position:absolute;left:20px;bottom:20px;right:20px;background:color-mix(in srgb,var(--card) 94%,transparent);border-radius:18px;padding:14px 16px;font-size:13px;color:var(--muted)}
.art .tag b{color:var(--ink);font-size:15px;display:block}

section{max-width:1080px;margin:0 auto;padding:56px 20px}
h2{font-family:"Cormorant Garamond",serif;font-size:clamp(34px,5vw,48px);font-weight:600;line-height:1.05;margin-bottom:8px}
h2 em{color:var(--accent)}
.sub{color:var(--muted);margin-bottom:28px}
.note{font-size:13px;color:var(--muted);margin-top:16px}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:700px){.gallery{grid-template-columns:repeat(2,1fr)}}
.ph{border-radius:var(--r);aspect-ratio:4/5;position:relative;overflow:hidden}
.gallery.stagger .ph:nth-child(3n+2){margin-top:30px}
@media(max-width:700px){.gallery.stagger .ph:nth-child(3n+2){margin-top:0}.gallery.stagger .ph:nth-child(2n){margin-top:30px}}
.ph span{position:absolute;left:10px;right:10px;bottom:10px;background:color-mix(in srgb,var(--card) 94%,transparent);border-radius:14px;padding:8px 11px;font-size:13px;font-weight:700}
.ph span small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.p0{background:repeating-linear-gradient(100deg,var(--a1) 0 11px,color-mix(in srgb,var(--a1) 80%,var(--a2)) 11px 22px)}
.p1{background:radial-gradient(circle at 30% 30%,var(--soft) 0 22%,transparent 23%),radial-gradient(circle at 70% 58%,color-mix(in srgb,var(--soft) 70%,var(--a1)) 0 17%,transparent 18%),linear-gradient(160deg,var(--a1),var(--a2))}
.p2{background:repeating-linear-gradient(0deg,var(--a2) 0 8px,color-mix(in srgb,var(--a2) 75%,var(--a1)) 8px 16px)}
.p3{background:conic-gradient(from 120deg,var(--hi),var(--a1),var(--a2),var(--hi))}
.p4{background:repeating-linear-gradient(45deg,var(--soft) 0 12px,color-mix(in srgb,var(--soft) 70%,var(--a1)) 12px 24px)}
.p5{background:radial-gradient(circle at 50% 36%,var(--soft) 0 26%,var(--a1) 27% 100%)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.ph:hover img{transform:scale(1.04)}
.ph.empty{background:var(--bg2);border:2px dashed color-mix(in srgb,var(--accent) 30%,var(--line))}
.ph.empty span{top:50%;bottom:auto;transform:translateY(-50%);background:none;text-align:center;color:var(--accent-d)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:700px){.menu{grid-template-columns:1fr}}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;justify-content:space-between;gap:14px}
.item h3{font-size:16px}
.item p{font-size:13px;color:var(--muted)}
.price{font-family:"Cormorant Garamond",serif;font-size:27px;font-weight:700;color:var(--accent);white-space:nowrap;text-align:right;line-height:1}
.price small{display:block;font-family:"DM Sans";font-size:11px;color:var(--muted);font-weight:500;margin-top:4px}

.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:820px){.shop{grid-template-columns:repeat(2,1fr)}}
.prod{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column}
.prod .img{border-radius:16px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin-bottom:12px;background:var(--bg2)}
.prod:nth-child(even) .img{background:var(--soft)}
.prod h3{font-size:15px}
.prod p{font-size:12px;color:var(--muted);flex:1;margin:2px 0 10px}
.prod .row2{display:flex;justify-content:space-between;align-items:center}
.prod .cost{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:700;color:var(--accent)}
.prod a{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;border:1.5px solid var(--accent);border-radius:999px;padding:5px 11px}
.i-hair{width:42px;height:80px;border-radius:8px;background:repeating-linear-gradient(0deg,var(--a2) 0 4px,var(--a1) 4px 8px);border-top:10px solid var(--hi)}
.i-oil{width:34px;height:78px;border-radius:10px 10px 16px 16px;background:linear-gradient(160deg,var(--soft),var(--accent));position:relative}
.i-oil:before{content:"";position:absolute;top:-14px;left:9px;width:16px;height:14px;background:var(--deep);border-radius:4px 4px 0 0}
.i-jar{width:60px;height:50px;border-radius:12px;background:linear-gradient(160deg,var(--soft),var(--hi));box-shadow:inset 0 11px 0 var(--accent-d)}
.i-bonnet{width:82px;height:48px;border-radius:50px 50px 16px 16px;background:linear-gradient(160deg,var(--accent),var(--accent-d))}

.band{background:var(--deep);color:var(--deep-text)}
.band section{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media(max-width:760px){.band section{grid-template-columns:1fr}}
.band h3{font-family:"Cormorant Garamond",serif;font-size:27px;color:#fff;margin-bottom:6px;font-weight:600}
.band .num{color:var(--hi);font-family:"Cormorant Garamond",serif;font-size:20px;font-style:italic}

.visit{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.visit{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:8px 0;border-bottom:1px dashed var(--line)}
.hours td:last-child{text-align:right;color:var(--muted)}
.hours .closed td:last-child{color:var(--accent)}
.panel .big{font-family:"Cormorant Garamond",serif;font-size:31px;font-weight:700;line-height:1.1}
.panel p{color:var(--muted);margin:8px 0 16px}

.top.dark{background:radial-gradient(120% 80% at 90% 10%,color-mix(in srgb,var(--a1) 45%,transparent),transparent 60%),var(--deep);color:#fff;border-radius:0 0 40px 40px}
.top.dark .logo{color:#fff}.top.dark .logo span{color:var(--pink,var(--soft))}
.top.dark nav a{color:var(--deep-text)}
.top.dark h1{color:#fff}.top.dark h1 em{color:var(--pink,var(--soft))}
.top.dark .lede,.top.dark .stats div{color:var(--deep-text)}
.top.dark .stats strong{color:#fff}
.top.dark .eyebrow{background:color-mix(in srgb,var(--pink,var(--soft)) 18%,transparent);color:var(--pink,var(--soft))}
.top.dark .btn{background:var(--pink,var(--soft));border-color:var(--pink,var(--soft));color:var(--deep);box-shadow:none}
.top.dark .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.top.dark .art{box-shadow:0 30px 60px -30px #000}
.pinkdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink,var(--accent));margin-right:8px;vertical-align:middle}
h2 em{text-decoration:underline;text-decoration-color:var(--pink,transparent);text-decoration-thickness:3px;text-underline-offset:6px}
.price small,.prod .cost{}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 20px 92px}
.sticky{position:fixed;left:12px;right:12px;bottom:12px;display:none;gap:10px;z-index:9}
.sticky a{flex:1;text-align:center}
.sticky .ghost{background:var(--bg)}
@media(max-width:640px){.sticky{display:flex}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== EDIT THIS FOR EACH CLIENT ===================== */
const SITE = {
  theme: "plum", darkHero: true, heroShape: "blob", gallery: "grid", sample: true,
  name: ["B.Hair", "Braiding"],
  headline: "Soft, neat braids<br>by <em>Mrs. B.</em>",
  lede: "Tree braids, knotless and protective styles in North Dallas — with honest advice and her own hair oil to keep your scalp happy between visits.",
  rating: "5.0", reviews: "40+", statLabel: ["Same-day", "openings often"],
  phone: "(214) 566-1152", tel: "+12145661152",
  address: "5990 Arapaho Rd · Dallas, TX 75248",
  mapQuery: "5990 Arapaho Rd Dallas TX 75248",
  hours: [["Every day","By appointment"],["Last-minute?","Call to check"]],
  heroPhoto: "images/boho-knotless-honey.jpg", heroTag: ["Boho knotless, honey brown", "Recent work by Mrs. B."],
  gallerySub: "Recent work from the chair — tap a style when you book so Mrs. B knows the look.",
  // [style, detail, photo]. Photos are 960x1200 (4:5). Swap a file, or add a row, to update the gallery.
  styles: [
    ["Knotless Braids","Auburn · mid-back","images/knotless-auburn.jpg"],
    ["Boho Knotless","Copper curly ends","images/boho-knotless-copper.jpg"],
    ["Boho Knotless","Long, soft curls","images/boho-knotless-black.jpg"],
    ["Passion Twists","Light & springy","images/passion-twists.jpg"],
    ["Senegalese Twists","Sleek middle part","images/senegalese-twists.jpg"],
    ["Stitch Cornrows","Clean straight-backs","images/stitch-cornrows.jpg"],
    ["Microlocs","Honey ombré ends","images/sisterlocks-ombre.jpg"],
    ["Microlocs","Neat, even parting","images/sisterlocks-classic.jpg"],
    ["Boho Locs","Curly honey pieces","images/boho-locs-honey.jpg"],
    ["Boho Locs","Space-bun finish","images/boho-locs-buns.jpg"],
    ["Kinky Twists","Install in progress","images/kinky-twist-install.jpg"],
    ["Boho Knotless","Honey brown","images/boho-knotless-honey.jpg"]
  ],
  emptySlots: 3,               // dashed "room for another photo" tiles after the gallery
  services: [["Tree Braids","About 6¾ hrs","$300"],["Braid Take-Down","About 2½ hrs","$100","and up"],["Knotless Braids","Priced by size & length","Ask"],["Box Braids","Priced by size & length","Ask"],["Kids Braids","Patient, gentle styling","Ask"],["Not sure yet?","Ask if your hair is long enough first","Ask"]],
  priceNote: "Tree braid and take-down prices come from the salon's public booking page. Call for a quote on other styles.",
  products: [["oil","B Hair Oil","Mrs. B's own scalp & hair oil","$25"],["bonnet","Satin Bonnet","Protects braids overnight","$10"],["jar","Edge Control","Soft hold, no flakes","$12"],["hair","Braiding Hair","Pre-stretched, lightweight","$8"]],
  productNote: "B Hair Oil is from the salon's booking page. Other products and prices are examples — swap in what she carries.",
  why: [["Honest advice","If your hair isn't ready for a style yet, Mrs. B will tell you — and help you get there."],["Last-minute friendly","Plans changed? Same-day openings come up often."],["Patient with kids","Gentle, neat braids for little ones and tender heads."]],
  closing: ["Book your next style","Call or text with a photo of the look you want — you'll get a price before you sit down."]
};
/* ===================================================================== */

document.body.dataset.theme = SITE.theme;
const braidSVG = `<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="rgba(255,255,255,.45)" stroke-width="10" stroke-linecap="round">${[120,200,280].map(x=>`<path d="M${x} -10 C ${x+50} 60, ${x-50} 120, ${x} 190 S ${x-50} 320, ${x} 390 S ${x-50} 520, ${x} 560"/><path d="M${x} -10 C ${x-50} 60, ${x+50} 120, ${x} 190 S ${x+50} 320, ${x} 390 S ${x+50} 520, ${x} 560"/>`).join("")}</g></svg>`;
const full = SITE.name.join(" ");
document.title = SITE.sample ? `${full} — Sample Site` : full;
document.getElementById("app").innerHTML = `
${SITE.sample ? `<div class="ribbon">Sample design by <b>Marvaden Studio</b> · not yet the official site of ${full}</div>` : ""}
<div class="top ${SITE.darkHero?"dark":""}"><header><div class="logo">${SITE.name[0]} <span>${SITE.name[1]}</span></div>
<nav><a href="#styles">Styles</a><a href="#services">Prices</a><a href="#shop">Shop</a><a href="#visit">Visit</a></nav></header>
<div class="hero"><div>
  <span class="eyebrow">★ ${SITE.rating} on Google · ${SITE.reviews} reviews</span>
  <h1>${SITE.headline}</h1><p class="lede">${SITE.lede}</p>
  <div class="cta"><a class="btn" href="#services">See styles &amp; prices</a><a class="btn ghost" href="tel:${SITE.tel}">Call ${SITE.phone}</a></div>
  <div class="stats"><div><strong>${SITE.rating}★</strong>Google rating</div><div><strong>${SITE.reviews}</strong>happy reviews</div><div><strong>${SITE.statLabel[0]}</strong>${SITE.statLabel[1]}</div></div>
</div>
<div class="art ${SITE.heroShape}">${SITE.heroPhoto ? `<img src="${SITE.heroPhoto}" alt="${SITE.heroTag[0]}">` : braidSVG}<div class="tag"><b>${SITE.heroPhoto ? SITE.heroTag[0] : "Your best photo goes here"}</b>${SITE.heroPhoto ? SITE.heroTag[1] : "Pulled from your Instagram and Google — real work sells."}</div></div></div></div>

<section id="styles"><h2>Style <em>gallery</em></h2><p class="sub"><span class="pinkdot"></span>${SITE.gallerySub || "Browse recent work — every tile becomes a real photo from your Instagram."}</p>
<div class="gallery ${SITE.gallery}">${SITE.styles.map((s,i)=>s[2]
  ? `<figure class="ph"><img src="${s[2]}" alt="${s[0]}, ${s[1]}" width="960" height="1200" loading="lazy"><span>${s[0]}<small>${s[1]}</small></span></figure>`
  : `<div class="ph p${i%6}"><span>${s[0]}<small>${s[1]}</small></span></div>`).join("")}${"<div class=\"ph empty\"><span>+ Your next style<small>Room for another photo</small></span></div>".repeat(SITE.emptySlots || 0)}</div></section>

<section id="services" style="padding-top:0"><h2>Styles &amp; <em>prices</em></h2><p class="sub">Clear prices up front — no surprises at the end of your appointment.</p>
<div class="menu">${SITE.services.map(s=>`<div class="item"><div><h3>${s[0]}</h3><p>${s[1]}</p></div><div class="price">${s[2]}${s[3]?`<small>${s[3]}</small>`:""}</div></div>`).join("")}</div>
<p class="note">${SITE.priceNote}</p><div class="cta"><a class="btn" href="tel:${SITE.tel}">Book your appointment</a></div></section>

<section id="shop" style="padding-top:0"><h2>Hair care <em>shop</em></h2><p class="sub">Keep your braids fresh between visits. Pick up at your appointment.</p>
<div class="shop">${SITE.products.map(p=>`<div class="prod"><div class="img"><div class="i-${p[0]}"></div></div><h3>${p[1]}</h3><p>${p[2]}</p><div class="row2"><span class="cost">${p[3]}</span><a href="tel:${SITE.tel}">Reserve</a></div></div>`).join("")}</div>
<p class="note">${SITE.productNote}</p></section>

<div class="band" id="why"><section>${SITE.why.map((w,i)=>`<div><div class="num">0${i+1} <span class="pinkdot"></span></div><h3>${w[0]}</h3><p>${w[1]}</p></div>`).join("")}</section></div>

<section id="visit"><h2>Visit the <em>salon</em></h2><p class="sub">${SITE.address}</p>
<div class="visit"><div class="panel"><table class="hours">${SITE.hours.map(h=>`<tr class="${h[1]==="Closed"?"closed":""}"><td>${h[0]}</td><td>${h[1]}</td></tr>`).join("")}</table></div>
<div class="panel"><div class="big">${SITE.closing[0]}</div><p>${SITE.closing[1]}</p>
<div class="cta" style="margin-top:0"><a class="btn" href="tel:${SITE.tel}">Call now</a><a class="btn ghost" href="https://maps.google.com/?q=${encodeURIComponent(SITE.mapQuery)}">Get directions</a></div></div></div></section>

<footer>© ${full}<br>Website design by Marvaden Studio · (240) 342-9767</footer>
<div class="sticky"><a class="btn" href="tel:${SITE.tel}">Call to book</a><a class="btn ghost" href="#services">Prices</a></div>`;
</script>
</body>
</html>
